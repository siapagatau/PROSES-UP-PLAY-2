name: Build Signed Release AAB (Free)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Platform & build-tools 36 (Android 16), sesuai compileSdk/targetSdk
      # yang sudah dinaikkan di app/build.gradle.kts.
      # sdkmanager minta konfirmasi terima lisensi tiap kali ada tools/package baru
      # (misal Command-line Tools versi baru) -> di CI gak ada yang jawab prompt-nya,
      # jadi wajib di-auto-accept dulu pakai `yes` sebelum install package apapun.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK & CMake
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      # AGP 9.1.0 minimal butuh Gradle 9.2.1.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # Decode keystore dari GitHub Secret (base64) jadi file .jks di root project
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      # Build App Bundle (.aab) untuk flavor FREE, sudah ditandatangani
      # pakai keystore di atas lewat -P (project property) supaya password/alias
      # tidak perlu ditulis permanen di build.gradle.kts.
      - name: Build signed release AAB (free)
        run: |
          gradle bundleFreeRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-dtx-free-release
          path: app/build/outputs/bundle/freeRelease/app-free-release.aab

      # Hapus keystore dari runner setelah build selesai (jaga-jaga)
      - name: Cleanup keystore
        if: always()
        run: rm -f release.jks
